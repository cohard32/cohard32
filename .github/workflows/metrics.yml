name: Metrics

on:
  schedule:
    - cron: "0 4 * * 1"   # Her pazartesi 07:00 (TR)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Secret yoksa hiçbir şey üretme, mevcut metrics.svg olduğu gibi kalsın
      - name: Token kontrolü
        env:
          METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: |
          if [ -z "$METRICS_TOKEN" ]; then
            echo "::error::METRICS_TOKEN secret'i tanımlı değil, metrics.svg güncellenmedi."
            exit 1
          fi

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: metrics.svg
          template: classic
          committer_message: "chore: metrics güncellendi [skip ci]"
          config_timezone: Europe/Istanbul
          config_display: large
          base: header, activity, community, repositories
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          # Son aktivite: son 6 ayın katkı takvimi.
          # (plugin_activity, GitHub'ın PushEvent değişikliği yüzünden v3.34'te çöküyor)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
